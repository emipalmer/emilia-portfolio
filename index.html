<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>emilia — computer science @ penn state</title>
  <meta name="description" content="Portfolio of Emilia, a computer science student at Penn State and aspiring software developer.">

  <!-- Open Graph: controls the preview card when the link is shared.
       TODO: replace the og:url + og:image once the site has a real domain. -->
  <meta property="og:title" content="hi, i'm emilia.">
  <meta property="og:description" content="Computer science @ Penn State. Aspiring software developer.">
  <meta property="og:type" content="website">

  <!-- Figtree: geometric grotesque with a true italic, matching the mockup's headline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

  <!-- Inline favicon: a mint square with a forest-green 'e'. No extra request. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23F4FFF0'/><text x='16' y='23' font-family='Georgia,serif' font-style='italic' font-size='20' text-anchor='middle' fill='%23163808'>e</text></svg>">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <!-- Screen-reader + keyboard shortcut past the decorative nav. -->
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- The one chevron every control on the site uses; rotated in CSS. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <symbol id="chevron" viewBox="0 0 22 22"><path d="M8.25 5.5 13.75 11 8.25 16.5"/></symbol>
  </svg>

  <!-- ================= Top navigation ================= -->
  <header class="topbar">
    <!-- Every destination is here, so the site stays usable with the phone put away. -->
    <nav class="pill" id="primaryNav" aria-label="Primary">
      <ul class="pill__list">
        <li><a class="pill__link" href="#/home">home</a></li>
        <li><a class="pill__link" href="#/about">about</a></li>
        <li><a class="pill__link" href="#/projects">projects</a></li>
        <li><a class="pill__link" href="#/experience">experience</a></li>
        <li><a class="pill__link" href="#/contact">contact</a></li>
      </ul>
      <!-- Slides under the active link. Positioned in JS so it can animate. -->
      <span class="pill__marker" aria-hidden="true"></span>
    </nav>

    <!-- Slides the nav up past the top edge (desktop only). -->
    <button class="nav-toggle" type="button" id="navToggle"
            aria-controls="primaryNav" aria-expanded="true" aria-label="Hide navigation">
      <svg class="chevron chevron--up" aria-hidden="true"><use href="#chevron"/></svg>
    </button>
  </header>

  <!-- ================= Page body =================
       Two columns on desktop: written content left, phone navigator right. -->
  <div class="stage">
    <main class="content" id="main">
      <!-- Filled by js/app.js on every route change. -->
      <article class="page" id="page" tabindex="-1"></article>
    </main>

    <!-- ================= Phone navigator =================
         The primary way to move around the site on desktop.
         Hidden on small screens, where the pill nav takes over. -->
    <div class="phone-area" id="phoneArea">
      <!-- Slides the phone off the right edge, widening the content column. -->
      <button class="phone-hide" type="button" id="phoneHide"
              aria-controls="phoneArea" aria-expanded="true">
        <span aria-hidden="true">&rsaquo;&rsaquo;</span>
        <span class="sr-only">Put the phone away</span>
      </button>

      <button class="chev chev--prev" type="button" aria-label="Previous phone screen">
        <svg class="chevron chevron--left" aria-hidden="true"><use href="#chevron"/></svg>
      </button>

      <div class="phone" role="group" aria-label="Site navigator">
        <div class="phone__bezel">
          <div class="phone__notch" aria-hidden="true"></div>
          <div class="phone__screen">
            <!-- Screens are rendered by JS; the track slides horizontally. -->
            <div class="screens" id="screens"></div>

            <!-- Dock: always-present shortcut back to home. Icon added by JS. -->
            <div class="dock">
              <button class="tile tile--dock" type="button" data-route="#/home" aria-label="Go to home"></button>
            </div>
          </div>
        </div>
      </div>

      <button class="chev chev--next" type="button" aria-label="Next phone screen">
        <svg class="chevron" aria-hidden="true"><use href="#chevron"/></svg>
      </button>

      <!-- Dots show which phone screen you're on. -->
      <div class="dots" id="dots" role="tablist" aria-label="Phone screens"></div>

      <p class="hint">
        use this to navigate :)
        <!-- Rises from the end of the text and points up into the phone. -->
        <svg class="hint__arrow" viewBox="0 0 40 30" aria-hidden="true">
          <path d="M4 26c14 2 24-6 28-20" />
          <path d="M27 10.9 32 6l1.7 6.8" />
        </svg>
      </p>
    </div>
  </div>

  <!-- Handle pinned to the right edge; only reachable while the phone is away. -->
  <button class="phone-tab" type="button" id="phoneTab"
          aria-controls="phoneArea" aria-expanded="false" tabindex="-1">
    <span aria-hidden="true">&lsaquo;</span>
    <span class="phone-tab__label">phone</span>
  </button>

  <!-- Page label, bottom-left. Mirrors the mockup's print("...") motif. -->
  <p class="stamp" id="stamp" aria-hidden="true"></p>

  <!-- Vendored, no build step: card motion and scroll-linked reveals. -->
  <script src="js/vendor/gsap.min.js"></script>
  <script src="js/vendor/ScrollTrigger.min.js"></script>

  <script src="js/icons.js"></script>
  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
